name: APK Factory

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project from Dropbox
        run: |
          curl -L -o mod-installer.zip \
            "https://www.dropbox.com/scl/fi/c3u2cwgb8fb6v1pj5nnsv/mod-installer.zip?rlkey=55prf613xt5ve9f8w9dnpkqt7&st=as3a44k3&dl=1"
          ls -la mod-installer.zip
          file mod-installer.zip

      - name: Unzip project
        run: |
          unzip -o mod-installer.zip -d unpacked
          if [ -d unpacked/mod-installer ]; then
            shopt -s dotglob
            mv unpacked/mod-installer/* .
          else
            shopt -s dotglob
            mv unpacked/* .
          fi
          rm -rf unpacked mod-installer.zip
          echo "=== Структура ==="
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (with licenses)
        run: |
          # Скачиваем commandline-tools
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest 2>/dev/null || true
          rm cmdline.zip

          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH

          # Принимаем лицензии
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          # Устанавливаем платформы и build-tools
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1

          # Прописываем в GitHub ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Check payload.apk
        run: |
          if [ ! -f app/src/main/assets/payload.apk ]; then
            echo "❌ payload.apk не найден"
            ls -la app/src/main/assets/ || true
            exit 1
          fi
          echo "✅ payload.apk найден"
          du -h app/src/main/assets/payload.apk

      - name: Generate keystore
        run: |
          keytool -genkeypair -v -keystore release.keystore \
            -alias modkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass modpass123 -keypass modpass123 \
            -dname "CN=Mod Installer, O=Mod, C=UZ"

      - name: Build Release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-installer-apk
          path: app/build/outputs/apk/release/*.apk
